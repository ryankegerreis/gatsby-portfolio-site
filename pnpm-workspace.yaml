allowBuilds:
  "@parcel/watcher": true
  core-js: false
  core-js-pure: false
  es5-ext: false
  gatsby: true
  gatsby-cli: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
nodeLinker: hoisted

# Security fixes for versions pinned by Gatsby's dependency tree.
overrides:
  "@graphql-tools/utils@<12.0.2": 12.0.2
  cookie: 0.7.2
  immutable: 3.8.4
  lodash: 4.18.1
  path-to-regexp: 0.1.13
  gatsby>query-string: 10.0.0
  serialize-javascript: 7.1.3
  sharp: 0.35.5
  tmp: 0.2.7
  uuid: 11.1.1
  webpack: 5.109.2
  webpack-dev-middleware: 7.4.6
