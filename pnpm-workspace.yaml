allowBuilds:
  '@parcel/watcher': true
  core-js: false
  core-js-pure: false
  es5-ext: false
  gatsby: true
  gatsby-cli: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
nodeLinker: hoisted

# Preserve the former npm security pins in pnpm configuration.
overrides:
  cookie: 0.7.2
  immutable: 3.8.3
  lodash: 4.18.1
  path-to-regexp: 0.1.13
  serialize-javascript: 7.0.7
  tmp: 0.2.7
  webpack: 5.109.2
